name: Publish

# Manual release only. iOS is covered by ci.yml on macOS and the iOS CI caveat
# still applies: ci.yml must be green (including iOS) before releasing. This
# workflow has no iOS job.
# The first version is published manually (see RELEASING.md); this workflow publishes later versions.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: run npm publish --dry-run and publish nothing'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: npm-publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1;
      # publishing with a dist-tag over OIDC needs npm >= 11.21.0.
      # node-version '22' matches ci.yml and resolves to the latest 22.x;
      # this check guards the minimum.
      - name: Use npm 11.21.0
        run: |
          npm install -g npm@11.21.0
          node -e '
          const { execFileSync } = require("node:child_process");
          function requireVersion(label, actual, minimum) {
            const parts = actual.replace(/^v/, "").split(".").map(Number);
            let comparison = 0;
            for (let i = 0; i < 3 && comparison === 0; i++) {
              comparison = parts[i] - minimum[i];
            }
            if (!Number.isFinite(comparison) || comparison < 0) {
              console.error(label + " >= " + minimum.join(".") + " is required for npm trusted publishing; found " + actual);
              process.exit(1);
            }
            console.log(label + ": " + actual);
          }
          requireVersion("Node", process.version, [22, 14, 0]);
          requireVersion("npm", execFileSync("npm", ["--version"], { encoding: "utf8" }).trim(), [11, 21, 0]);
          '
      - name: Require a prerelease matching the publish tag
        run: |
          node -e '
          const pkg = require("./package.json");
          const version = pkg.version;
          const tag = pkg.publishConfig && pkg.publishConfig.tag;
          const num = "(0|[1-9]\\d*)";
          const ident = "(?:0|[1-9]\\d*|\\d*[A-Za-z-][0-9A-Za-z-]*)";
          const re = new RegExp(
            "^" + num + "\\." + num + "\\." + num +
            "(?:-(" + ident + "(?:\\." + ident + ")*))?" +
            "(?:\\+[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?$"
          );
          const m = re.exec(String(version));
          if (!m) {
            console.error("Refusing to publish: " + JSON.stringify(version) + " is not a valid SemVer 2.0 version.");
            process.exit(1);
          }
          const prerelease = m[4];
          console.log("version: " + version);
          console.log("prerelease: " + (prerelease || "(none)"));
          console.log("publishConfig.tag: " + (tag || "(missing)"));
          if (!prerelease) {
            console.error("Refusing to publish: " + version + " is not a prerelease version (expected something like 0.1.0-alpha.0).");
            process.exit(1);
          }
          if (!tag) {
            console.error("Refusing to publish: publishConfig.tag is missing in package.json.");
            process.exit(1);
          }
          const first = prerelease.split(".")[0];
          if (first !== tag) {
            console.error("Refusing to publish: first prerelease identifier \"" + first + "\" does not match publishConfig.tag \"" + tag + "\".");
            process.exit(1);
          }
          '
      - name: Refuse an already-published version
        shell: bash
        run: |
          set -euo pipefail
          NAME=$(node -p 'require("./package.json").name')
          VERSION=$(node -p 'require("./package.json").version')
          set +e
          OUTPUT=$(npm view "$NAME@$VERSION" version --json)
          STATUS=$?
          set -e
          node - "$STATUS" "$VERSION" "$OUTPUT" <<'NODE'
          const [status, version, output] = process.argv.slice(2);
          let result;
          try {
            result = JSON.parse(output);
          } catch {
            // Unexpected output is handled below.
          }
          if (status === "0" && (result === version || (Array.isArray(result) && result.includes(version)))) {
            console.error("Refusing to publish: " + version + " is already published.");
            process.exit(1);
          }
          if (status !== "0" && result && result.error && result.error.code === "E404") {
            console.log("Version is not published; continuing.");
            process.exit(0);
          }
          console.error("Refusing to publish: npm version lookup failed (exit " + status + ").");
          console.error(output || "(no stdout)");
          process.exit(1);
          NODE
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # tag, provenance and access come from publishConfig in package.json:
      # no --tag, --provenance or --access flags are passed on the CLI.
      - name: Publish (dry run)
        if: ${{ inputs.dry_run }}
        # The log may say "Publishing ... with tag latest"; that is cosmetic.
        # The real publish uses publishConfig.tag.
        run: npm publish --dry-run
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        # Authenticates with npm trusted publishing (OIDC via id-token: write), no token.
        # Provenance is generated automatically; publishConfig.provenance stays true.
        # Tag and access come from publishConfig. The npm-side trusted publisher
        # must allow npm publish for publish.yml + environment npm-publish.
        run: npm publish
